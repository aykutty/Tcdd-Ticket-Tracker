spring.application.name=YhtWatch

server.port=8080

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

tcdd.api.base-url=https://web-api-prod-ytp.tcddtasimacilik.gov.tr
tcdd.api.availability-path=/tms/train/train-availability?environment=dev&userId=1

scheduler.check-interval-ms=300000  

logging.level.root=INFO
logging.level.com.yhtwatch=DEBUG

